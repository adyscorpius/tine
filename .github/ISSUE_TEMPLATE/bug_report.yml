name: Bug report
description: Report something that doesn't work
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (OS, version)
    validations:
      required: true
