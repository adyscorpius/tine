name: Release

# Heavier pipeline, gated on a version tag (or manual dispatch, as a
# smoke test that the pipeline itself still works without cutting a
# real release). The draft-until-everything-succeeds pattern below
# means a partial matrix failure never publishes a broken release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              draft: true,
            });
            return data.id;

  build:
    needs: [create-release]
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo build --release -p shell
      # Replace with your actual packaging step (tauri-action, cargo
      # dist, a platform-specific bundler) and upload to
      # needs.create-release.outputs.release_id.

  publish-release:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
